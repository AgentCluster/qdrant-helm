apiVersion: v1
kind: PersistentVolume
metadata:
  name: qdrant-storage-pv
spec:
  capacity:
    storage: 10Gi  # Storage için
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/qdrant-storage  # Storage için ayrı path
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - server-1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qdrant-snapshots-pv
spec:
  capacity:
    storage: 20Gi  # Snapshots için - staging-values.yaml'daki gibi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/qdrant-snapshots  # Snapshots için ayrı path
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - server-1